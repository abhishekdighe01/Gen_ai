# CI/CD Pipeline
# This workflow runs on every push and pull request
# It performs linting (ruff) and testing (pytest) to ensure code quality

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Ruff Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest test suite
        run: pytest -v

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SuryaGharSathi Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: suryagharsathi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
