[pytest]
# Pytest configuration for SuryaGharSathi
# Day 12 - CI/CD fix: only run tests in tests/ directory

# Test discovery: only look in tests/ directory
testpaths = tests

# Ignore old test files in root and other directories
norecursedirs = .git .venv node_modules __pycache__ *.egg-info build dist .pytest_cache

# Verbose output
addopts = -v --tb=short

# Python files pattern
python_files = test_*.py

# Python classes pattern
python_classes = Test*

# Python functions pattern
python_functions = test_*
