# Render Blueprint for SuryaGharSathi
# Day 12 - Cloud deployment configuration

services:
  # FastAPI Backend
  - type: web
    name: suryagharsathi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
    healthCheckPath: /health
    plan: free  # Can upgrade to starter/standard for production
