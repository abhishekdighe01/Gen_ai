version: '3.8'

services:
  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suryagharsathi-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.3-70b-versatile
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - suryagharsathi-network

  # Streamlit UI Service
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suryagharsathi-ui
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api:8000
    volumes:
      - ./ui:/app/ui
      - ./data:/app/data
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - suryagharsathi-network

networks:
  suryagharsathi-network:
    driver: bridge
